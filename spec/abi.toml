# SPDX-License-Identifier: MIT OR Apache-2.0
# spec/abi.toml — MỘT nguồn sự thật cho ABI v2 (D2-11). Code sinh từ tệp này, không sửa tay.
#
# status = "APPROVED": duyệt 2026-11-12 bởi Agent 0 (D2-35); sau duyệt CHỈ Agent 0 sửa (D2-22).
# Nhãn: mục nào không có nguồn dẫn thì là [TK] (thiết kế mới), đã duyệt nguyên đề xuất.
#
# Nguồn dẫn: QD §4 (syscall 0..15, dải 16..31 reserved, 19 mã lỗi, method thêm);
# thiết kế §4.6 (MessageInfo 35 bit, 64 MR + 4 cap), §4.20 (mã lỗi), §4.21 (bảng ABI),
# §3.9 (slot 48 B), §4.22 (kernel.toml); code v1 để lấy quy ước gọi riscv64:
# crates/vifast-user/src/lib.rs (a7 = số hiệu, a0/a1 = tham số + (error,value),
# a2 = MessageInfo, a3..a6 = 4 MR) — xem cụm [calling.riscv64].

name = "vifast-abi"
status = "APPROVED"
abi_version = 1
min_compat = 1
# Golden file do vifast-gen sinh (KT-05); gate --fast chạy gen-check từ KT-05.
golden = "test/abi/abi-v1.golden"

# ---------------------------------------------------------------------------
# Đóng băng ABI (D2-15 / QD §1 Q-B): đúng 5 thứ. Mọi thứ khác là `reserved`.
[frozen]
wire_syscalls = true          # (1) số syscall 0..15 + quy ước thanh ghi riscv64
message_layout = true         # (2) layout MessageInfo + MR trong thanh ghi + receive window
error_table = true            # (3) 19 mã lỗi + quy ước trả lỗi (a0 = error, a1 = value)
object_layout = true          # (4) kích thước/căn lề object theo arch
id_reuse = "never"            # (5) ID không bao giờ tái dùng; xoá = deprecated, giữ số

# ---------------------------------------------------------------------------
# Giới hạn message (QD §3.13: 64 MR + 4 cap — thay đổi có chủ ý so với v1).
[message]
max_words = 64
max_caps = 4
words_in_registers = 4        # MR0..MR3 ở a3..a6 (v1 riscv64 cũng 4; "có thể 6" [ƯL] không chọn)
words_in_ipc_buffer = 60
ipc_buffer_bytes = 4096
ipc_buffer_align = 16

# MessageInfo nằm gọn trong MỘT thanh ghi (thiết kế §4.6): 20+3+1+4+7 = 35 bit.
[message_info]
bits = 35
label_bits = 20
caps_bits = 3                 # ≤ 4 cap
no_reply_bits = 1
extra_caps_unwrapped_bits = 4
length_bits = 7               # ≤ 64 MR
# Thứ tự bit trên thanh ghi (bit thấp trước) — [TK], chờ duyệt ở KT-04d.
layout = "label:0..19, caps:20..22, no_reply:23, extra_caps_unwrapped:24..27, length:28..34"

# Quy ước gọi. riscv64 đóng băng NGAY (D2-15); 2 arch còn lại chỉ giữ chỗ (D2-10).
[calling.riscv64]
syscall_number = "a7"
args = ["a0", "a1"]
message_info = "a2"
mr_registers = ["a3", "a4", "a5", "a6"]
return_error = "a0"           # 0 = thành công, khác 0 = mã lỗi (1..19)
return_value = "a1"
ipc_buffer = "Frame bind qua Tcb.Configure; header chứa receive window (CPTR, ≤4 cap)"
preserved = ["sp", "gp", "tp", "s0..s11", "fs0..fs11"]
note = "Lấy đúng quy ước v1 đang chạy (crates/vifast-user/src/lib.rs), không tự đặt"

[calling.aarch64]
reserved = true
note = "Mở ở K4' theo D2-10; chỉ giữ số, không đóng băng chữ ký"

[calling.x86_64]
reserved = true
note = "Mở ở K5' theo D2-10; chỉ giữ số, không đóng băng chữ ký"

# ---------------------------------------------------------------------------
# Kích thước/căn lề (thứ đóng băng thứ 4). slot 48 B là [TK] của QD §3.9.
[object_size]
slot = { bytes = 48, align_bytes = 16, note = "QD §3.9 [TK] — sửa từ 32 B" }
default_align_bytes = 16
page_bytes = 4096
untyped_min_bytes = 4096
# Sizes dưới đây là [TK] — thiết kế §4.21 không cho con số; chờ duyệt ở KT-04d.
riscv64 = { tcb = 512, endpoint = 64, notification = 64, reply = 64, sched_context = 256, sched_control = 64, cnode_base = 64 }

# ---------------------------------------------------------------------------
# 19 mã lỗi (QD §4). Số 0 = thành công; 1..19 là mã lỗi. Mỗi mã kèm một word chi tiết.
[error]
1 = { name = "InvalidCapability", detail = "chỉ số tham số sai (a0/a1) hoặc cap không hợp lệ" }
2 = { name = "WrongObjectType", detail = "chỉ số tham số sai hoặc loại object mong đợi" }
3 = { name = "InsufficientRights", detail = "quyền còn thiếu (bit quyền)" }
4 = { name = "WxViolation", detail = "địa chỉ vi phạm W^X" }
5 = { name = "InvalidArgument", detail = "chỉ số tham số sai" }
6 = { name = "Alignment", detail = "căn lề yêu cầu" }
7 = { name = "SlotOccupied", detail = "slot đích đã có cap" }
8 = { name = "SlotEmpty", detail = "slot nguồn rỗng" }
9 = { name = "NotEnoughMemory", detail = "số byte còn thiếu" }
10 = { name = "AlreadyMapped", detail = "địa chỉ ảo đã map" }
11 = { name = "NotMapped", detail = "địa chỉ ảo chưa map" }
12 = { name = "MissingPageTable", detail = "cấp bảng trang thiếu" }
13 = { name = "HasChildren", detail = "số object con còn sống" }
14 = { name = "Busy", detail = "tài nguyên đang bận (vd IRQ line)" }
15 = { name = "Cancelled", detail = "thao tác bị huỷ do Suspend(Abort)" }
16 = { name = "Timeout", detail = "hết timeout_ep" }
17 = { name = "IllegalOperation", detail = "trạng thái TCB/object không cho phép" }
18 = { name = "NotSupported", detail = "method/object reserved chưa cài" }
19 = { name = "RangeError", detail = "chỉ số/chỉ số dải ngoài phạm vi" }

# ---------------------------------------------------------------------------
# 16 syscall (0..15; D2-29 cấp 15 cho DebugGetInfo). Dải 16..31 reserved.
[syscall]
0 = { name = "Call", args = "cap, MessageInfo, MR*, cap*", ret = "error, value", note = "Endpoint: IPC; object khác: invocation (method = label), trả ngay" }
1 = { name = "Send", args = "cap, MessageInfo, MR*, cap*", ret = "error, value", note = "Notification: Signal; Reply: trả lời; fault Exit: giao qua hàng gửi của fault_ep, không Reply" }
2 = { name = "NBSend", args = "cap, MessageInfo, MR*, cap*", ret = "error, value", note = "không chờ" }
3 = { name = "Recv", args = "cap, reply_cptr?", ret = "error, value, MessageInfo, MR*, cap*", note = "Endpoint hoặc Notification" }
4 = { name = "NBRecv", args = "cap", ret = "error, value, MessageInfo, MR*, cap*", note = "Poll: Busy khi không có message" }
5 = { name = "ReplyRecv", args = "reply_cap, cap, MessageInfo, MR*", ret = "error, value, MessageInfo, MR*", note = "đường nóng của server" }
6 = { name = "NBSendRecv", args = "send_cap, recv_cap, reply_cap, MessageInfo, MR*", ret = "error, value, MessageInfo, MR*", note = "passive server/driver" }
7 = { name = "NBSendWait", args = "send_cap, recv_cap, MessageInfo, MR*", ret = "error, value, MessageInfo, MR*", note = "passive server/driver" }
8 = { name = "Yield", args = "", ret = "error, value", note = "trả phần budget còn lại" }
9 = { name = "WaitAddr", args = "mrs: addr, expected", ret = "error, value", note = "futex wait" }
10 = { name = "WakeAddr", args = "mrs: addr, n", ret = "error, value", note = "futex wake" }
11 = { name = "ClockRead", args = "", ret = "error, value(ns)", note = "đồng hồ đơn điệu" }
12 = { name = "DebugPutStr", args = "user ptr, len", ret = "error, value", note = "feature debug" }
13 = { name = "DebugHalt", args = "code", ret = "không trả", note = "feature test; chỉ dùng cho test (QD §4)" }
15 = { name = "DebugGetInfo", args = "", ret = "error, abi_version, min_compat, features, num_harts", note = "Luôn có, không phụ thuộc feature debug/test (D2-29); không trả địa chỉ kernel" }
14 = { name = "Exit", args = "code", ret = "không trả", note = "lưu exit_code; có fault_ep → BlockedOnSend{fault_ep, call:false} mang FaultKind::Exit{code}; procsrv Recv xong → Inactive; không có fault_ep → Inactive ngay" }

[syscall_reserved]
from = 16
to = 31
note = "Dải reserved sau khi cấp 15 cho DebugGetInfo (D2-29); object chưa cài chỉ giữ số (QD §1 Q-B)."

# DebugGetInfo = syscall 15 (D2-29); luôn có, không feature gate.
[debug_info]
number = 15
status = "frozen"
returns = ["abi_version", "min_compat", "features", "num_harts"]
# Kênh trả (D2-35): syscall không dùng MR vào; a0 = error.
return_channel = { a1 = "abi_version", a3 = "min_compat", a4 = "features", a5 = "num_harts" }
note = "Luôn có; features là bitmap tính năng runtime dùng để kiểm tương thích lúc khởi động; không trả địa chỉ kernel."

# ---------------------------------------------------------------------------
# Object lõi (KT-04a). Số object đóng băng, ID không tái dùng.
# Lõi 1..8; reserved 9..16 đã cấp tên (D2-32); 17..31 còn trống.
[object]
Untyped = { id = 1, stability = "frozen", method = { 0 = { name = "Retype", args = "cap, type, size_bits, flags", note = "Revoke qua CNode.Revoke trên cap Untyped; flags có bit GUEST reserved (D2-32), type=VSpace+GUEST trả NotSupported tới H1" } } }
CNode = { id = 2, stability = "frozen", method = { 0 = { name = "Copy" }, 1 = { name = "Mint" }, 2 = { name = "Move" }, 3 = { name = "Mutate" }, 4 = { name = "Delete" }, 5 = { name = "Revoke" }, 6 = { name = "Rotate" } } }
Tcb = { id = 3, stability = "frozen", method = { 0 = { name = "Configure" }, 1 = { name = "SetFaultEp" }, 2 = { name = "ReadState" }, 3 = { name = "Suspend", args = "mode: Abort|Defer" }, 4 = { name = "SetPriority" }, 5 = { name = "SetMcp" }, 6 = { name = "SetAffinity" }, 7 = { name = "SetSchedParams" }, 8 = { name = "SetTimeoutEp" }, 9 = { name = "ReadRegs" }, 10 = { name = "WriteRegs" }, 11 = { name = "CopyRegs" }, 12 = { name = "Resume" }, 13 = { name = "BindNotification" }, 14 = { name = "UnbindNotification" }, 15 = { name = "SetTls", note = "K6" } } }
SchedContext = { id = 4, stability = "frozen", method = { 0 = { name = "Bind" }, 1 = { name = "Unbind" }, 2 = { name = "Consumed" }, 3 = { name = "YieldTo" } } }
Endpoint = { id = 5, stability = "frozen", method = {}, note = "chỉ qua syscall" }
Notification = { id = 6, stability = "frozen", method = {}, note = "chỉ qua syscall" }
Reply = { id = 7, stability = "frozen", method = {}, note = "chỉ qua syscall; Reply object do bên nhận cấp (QD §3.2)" }
SchedControl = { id = 8, stability = "core", method = { 0 = { name = "Configure" } }, note = "LÕI theo D2-32: MCS donation có từ K1b (D2-16); không vừa reserved vừa có chữ ký" }

VSpace = { id = 9, stability = "reserved", install_at = "K2", unsupported = true, method = { 0 = { name = "GetAsid", unsupported = true, note = "debug" } }, note = "method id 1 để TRỐNG: VSpace khách là bit GUEST trong flags của Untyped.Retype (D2-32)" }
PageTable = { id = 10, stability = "reserved", install_at = "K2", unsupported = true, method = { 0 = { name = "Map", unsupported = true }, 1 = { name = "Unmap", unsupported = true } } }
Frame = { id = 11, stability = "reserved", install_at = "K2", unsupported = true, method = { 0 = { name = "Map", unsupported = true }, 1 = { name = "Unmap", unsupported = true }, 2 = { name = "GetAddress", unsupported = true }, 3 = { name = "MapIo", unsupported = true }, 4 = { name = "UnmapIo", unsupported = true } } }
IrqControl = { id = 12, stability = "reserved", install_at = "K3", unsupported = true, method = { 0 = { name = "GetLine", unsupported = true }, 1 = { name = "GetMsi", unsupported = true } } }
IrqHandler = { id = 13, stability = "reserved", install_at = "K3", unsupported = true, method = { 0 = { name = "SetNotification", unsupported = true }, 1 = { name = "Ack", unsupported = true }, 2 = { name = "Clear", unsupported = true }, 3 = { name = "SetAffinity", unsupported = true } } }
IOSpace = { id = 14, stability = "reserved", install_at = "D3", unsupported = true, method = { 0 = { name = "Flush", unsupported = true }, 1 = { name = "Attach", unsupported = true } } }
VCpu = { id = 15, stability = "reserved", install_at = "H1", unsupported = true, method = { 0 = { name = "Run", unsupported = true }, 1 = { name = "ReadRegs", unsupported = true }, 2 = { name = "WriteRegs", unsupported = true }, 3 = { name = "InjectIrq", unsupported = true }, 4 = { name = "SetTsc", unsupported = true }, 5 = { name = "Configure", unsupported = true } } }
PowerControl = { id = 16, stability = "reserved", install_at = "P1", unsupported = true, method = { 0 = { name = "HartOffline", unsupported = true }, 1 = { name = "HartOnline", unsupported = true }, 2 = { name = "Suspend", unsupported = true } } }

[object_reserved]
from = 17
to = 31
note = "9..16 đã cấp tên (KT-04b, D2-32); 17..31 còn trống, ID không tái dùng (D2-15)"

# ---------------------------------------------------------------------------
# Chữ ký method — KT-05 bước 0 (D2-33 draft đã duyệt, D2-35). `stable-draft`: đổi chữ ký qua Agent 0,
# không cần tăng abi_version major (không thuộc 5 thứ đóng băng D2-15). Nguồn sinh code + docs/abi.md.
[method_signature]
stability = "stable-draft"
version = 1

[method_signature."Untyped.Retype"]
params = ["cap", "type", "size_bits", "flags"]
returns = []
# Giá trị trả `cap` chưa có nguồn thiết kế và 21 .scn không dùng; để K1a chốt riêng (D2-35).
note = "`flags` = tập TÊN cờ (bit GUEST reserved, D2-32); KHÔNG gán số bit ở đây. type = VSpace + GUEST ⇒ NotSupported tới H1"

[method_signature."CNode.Copy"]
params = ["cnode", "src", "dst", "rights?"]
returns = []

[method_signature."CNode.Mint"]
params = ["cnode", "src", "dst", "rights?", "badge?"]
returns = []

[method_signature."CNode.Move"]
params = ["cnode", "src", "dst"]
returns = []

[method_signature."CNode.Revoke"]
params = ["cnode", "slot?"]
returns = []

[method_signature."CNode.Delete"]
params = ["cnode", "slot"]
returns = []

[method_signature."Tcb.Configure"]
params = ["tcb", "cspace?", "vspace?", "entry?", "ipc_buffer?", "priority?"]
returns = []

[method_signature."Tcb.SetFaultEp"]
params = ["tcb", "cap"]
returns = []

[method_signature."Tcb.Suspend"]
params = ["tcb", "mode"]
variants = { mode = ["Abort", "Defer"] }
returns = []

[method_signature."Tcb.Resume"]
params = ["tcb"]
returns = []

[method_signature."Tcb.ReadState"]
params = ["tcb"]
returns = ["state", "suspended", "blocked_on_kind", "exit_code"]

[method_signature."SchedContext.Bind"]
params = ["sched", "target"]
note = "`target` là cap Reply/Notification (design §4.5: Notification bind SchedContext; donation qua Reply). TCB bind không có nguồn — bỏ."
returns = []

[method_signature."SchedControl.Configure"]
params = ["sched_control", "sched", "budget?", "period?", "refills?"]
returns = []

# ---------------------------------------------------------------------------
# Trạng thái TCB — **enum đầy đủ §4.4** (D2-33), không phải tập con.
[method_signature.state]
names = [
  "Inactive",
  "Ready",
  "Running",
  "BlockedOnSend",
  "BlockedOnRecv",
  "BlockedOnReply",
  "BlockedOnNotification",
  "BlockedOnAddress",
  "Sleeping",
  "Stopping",
  "Dead",
]
orthogonal_flags = ["suspended", "exit_code: Option<u64>"]

[method_signature.state.BlockedOnSend]
fields = ["ep", "call: bool", "fault: Option<FaultKind>"]

[method_signature.state.BlockedOnRecv]
fields = ["ep", "reply"]

[method_signature.state.BlockedOnReply]
fields = ["reply"]

[method_signature.state.BlockedOnNotification]
fields = ["ntfn"]

[method_signature.state.BlockedOnAddress]
fields = ["frame", "offset"]

[method_signature.state.Sleeping]
fields = ["reason"]
variants = { reason = ["Timeout", "Budget"] }

[method_signature.state.Running]
fields = ["hart"]

# D2-25: Exit mang theo mã thoát trong fault message; `BlockedOnSend.fault` là bổ sung D2-33.
[method_signature.fault_kind]
names = ["Exit"]
[method_signature.fault_kind.Exit]
fields = ["code: u64"]

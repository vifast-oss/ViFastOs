send = 'loop 6\n'
expect = '^# shell: loop n=6 LOOP OK used=[0-9]+/[0-9]+$'
timeout_ms = 6000
serial_min_count = 1
source = 'docs/v1/overnight-log.md:3388'
v1_output = 'LOOP OK'
status = 'active'
note = 'KT-345b: `LoopSvc` cua kernel lap spawn/destroy mot TCB THAT n lan (Retype Tcb+SchedContext tu Untyped 4 KiB rieng, Configure/Start, roi Delete+Revoke) — canh bao vong doi TCB; `used` truoc/sau in ra phai BANG nhau (product-riscv64.sh kiem cap so nay). Giu token `LOOP OK` cua v1; them `n=`/`used=` la so do that. v1 dat vong lap o root vi ngan sach client, v2 dat trong dich vu kernel cung ly do (ELF shell co ngan sach trang).'

[[command]]
name = 'history'
args = ''
send = 'echo K343\nhistory\n'
expect = '^# shell: history last=echo K343$'
timeout_ms = 2000
serial_min_count = 1
source = 'docs/v1/overnight-log.md:2776'
v1_output = 'last: echo hi'
status = 'active'
note = 'KT-343: shell giu MOT dong lich su (khong cap phat danh sach); `history` in `last=<lenh truoc>`, khop y "last: <lenh truoc>" cua v1. `echo K343` la tien de trong cung boot.'

[[command]]
name = '!!'
args = ''
send = 'echo K343\n!!\n'
expect = '^# shell: !! echo K343$'
timeout_ms = 2000
serial_min_count = 1
source = 'docs/v1/overnight-log.md:2776'
v1_output = '!!: echo hi -> hi'
status = 'active'
note = 'KT-343: chay lai dong lich su; in `# shell: !! <lenh>` truoc khi chay (v1 in `!!: <lenh>`). Khong luu chinh `!!`/`history` vao lich su => khong de quy vo han; boot moi khong co lenh truoc => `# shell: !! none` (ca am).'

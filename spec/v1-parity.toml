# KT-77a — nguồn sự thật cho "tương đương v1 ở mức người dùng" (OD-K6-2, Agent 0 17/11/2026).
#
# LUẬT (task KT-77a): mỗi mục **bắt buộc** có `source = file:dòng` trong `docs/v1/` chứng minh
# lệnh đó CÓ THẬT ở v1 (tag `v1-archive`). Không tìm được bằng chứng ⇒ **không** đưa vào.
# `docs/v1/` là đọc-only; tệp này KHÔNG sửa ABI (`abi.toml`/`kernel.toml` giữ nguyên).
#
# Trường:
#   name       tên lệnh v1 (đúng như bằng chứng ghi)
#   args       cú pháp đối số
#   send       chuỗi byte của kịch bản serial (escape `\n` = LF; runner giải mã)
#   expect     status=active  ⇒ **regex** (grep -E) mà log shell phải khớp
#              status=deferred-K7 ⇒ mô tả kết quả mong đợi ở v1 (tài liệu, không chạy)
#   transcript_expect  regex riêng cho chế độ transcript (script nội bộ kernel dùng đối số khác);
#              bỏ trống ⇒ dùng `expect`. Chế độ serial luôn dùng `expect`.
#   serial_min_count  số lần `expect` phải xuất hiện ở chế độ serial (help/ps = 2 vì kernel cũng
#              tự chạy một lần; echo/kill = 1 vì dùng chuỗi đặc trưng)
#   timeout_ms thời gian chờ tối đa cho `expect` (mili giây) — mỗi kịch bản
#   source     file:dòng trong docs/v1/ chứng minh lệnh có thật
#   status     active (v2 đã có lệnh, chạy được) | deferred-K7 (kèm `reason`)
#   v1_output  đầu ra đã đo/ghi ở v1 (nếu bằng chứng có nêu); rỗng = không có
#   note       khác biệt parity đã biết (v1 vs v2)
#
# Đếm: **28 mục** = **22 builtin** của shell v1 (bảng sinh tự động ở tag `v1-archive`:
# `v1-archive:docs/11-hien-tai/16-van-hanh.md` mục SHELL-TABLE, 22 dòng) + **6 applet ngoài**
# (`ps`, `free`, `df`, `uname`, `uptime`, `jobs`) — ở v1 chúng là chương trình `/bin/<tên>`
# (`v1-archive:crates/vifast-bin/src/main.rs:221-239`), shell gọi qua fallback exec-from-FS
# (`v1-archive:crates/vifast-client/src/main.rs:1180-1210`). Con số "25/26 lệnh" trong
# `docs/v1/overnight-log.md:2982,3397` là số builtin mà generator đếm ở các vòng 175/201, **không**
# gồm applet và **không** phải trạng thái cuối của tag.
# **Không** đưa vào: `args` — applet **debug** in argv (`v1-archive:crates/vifast-bin/src/main.rs:236`),
# không phải lệnh người dùng; ghi ở đây để không bỏ im lặng (A0 có thể yêu cầu thêm).
# Bằng chứng có **hai loại**: `docs/v1/...` (kho lưu v1, đọc-only) và `v1-archive:<đường dẫn>:dòng`
# (mã/tài liệu ở đúng tag `v1-archive` = `ca2eaf54`/r323).

schema = 1
runner = 'v2/test/parity/run.sh'

[meta]
task = 'KT-77a'
decision = 'OD-K6-2 (Agent 0, 17/11/2026) — Agent 1 thi hành theo D2-121'
v1_tag = 'v1-archive'
evidence_rule = 'moi muc phai co source = file:dong, hoac trong docs/v1 (kho luu) hoac v1-archive:<path>:dong (ma/tai lieu o tag v1-archive); khong co bang chung thi khong dua vao'
serial_newline_v1 = 'v1 nhan \r (docs/v1/agent2-report-62.md:24)'

serial_newline_v2 = 'shell v2 nhan \n (v2/kernel/vifast-kbin-riscv64/init/shell_user.rs:299)'
image_test = 'v2/kernel/target/riscv64gc-unknown-none-elf/release/vifast-kbin-ktest-proc'
image_product = 'v2/kernel/target/riscv64gc-unknown-none-elf/release/vifast-kbin-riscv64'

[image]
# D2-122(2): ảnh đo được ghi sha+size trong log của runner (`v2/test/parity/run.sh`);
# đóng băng `artifacts/<sha>.bin` thuộc KT-84. Ảnh sản phẩm hiện tại là **trước canonical**
# (fd202276…) — KHÔNG dùng làm bằng chứng v2.0.
canonical = 'chua co (KT-84 dong bang artifacts/<sha>.bin)'
product_pre_canonical = 'fd20227658832a3718b390b0cd7aab563396e23e01ecbd04632f7a9c4393a6da'

[serial]
# Quy ước attribution của chế độ serial (đo được trên ktest-proc):
#  - help/ps: ảnh test **cũng** tự chạy hai lệnh này (script nội bộ kernel) ⇒ expect phải xuất hiện
#    ≥ `serial_min_count` lần thì mới chứng minh dòng của kịch bản đã chạy.
#  - echo/kill: dùng chuỗi đặc trưng (echo K77A; kill 999 — kernel dùng pid thật khác) ⇒ 1 lần.
#  - send_delay_ms: cửa sổ an toàn để byte vào RBR sau khi chardev stdio sẵn sàng (đo: 40..150 ms).
send_delay_ms = 50
attribution = 'help/ps dem >= serial_min_count; echo/kill dung chuoi dac trung'


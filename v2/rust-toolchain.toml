# KT-79b (A1-174): GHIM toolchain của **dòng OS v2** — chỉ phủ cây `v2/` (khi build có cwd
# nằm trong `v2/` hoặc con của nó). KHÔNG đặt ở gốc repo: cargo/rustup tìm file này ở cwd và
# **mọi thư mục cha**, nên một file ở gốc repo sẽ áp cả `crates/`/`viscript/` — thay đổi chính
# sách build của dòng khác, ngoài quyền của task này (D2-121, A1-174).
# Bản sao cho workspace kernel: `v2/kernel/rust-toolchain.toml` (cùng nội dung).
# Các script build tái lập gọi **tường minh** `cargo +1.100.0` nên không phụ thuộc file này.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
]

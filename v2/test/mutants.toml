# `v2/test/mutants.toml` — **danh sách đột biến** của vòng kiểm (KT-403, D2-259; thiết kế §9.9).
#
# Thay 43 **khai báo** feature `mut-*` ad-hoc (23 đột biến phân biệt, khai báo ở nhiều crate)
# + `selfbreak` bằng MỘT manifest + lệnh `v2 mutants`.
#
# Cơ chế (`v2/tools/mutants.py`):
#   - `kind = "feature"`: trên **bản COPY** của cây (D2-113F: không bao giờ sửa cây thật)
#     lật mọi `feature = "<id>"` → `all()` và `not(feature = "<id>")` → `any()`;
#     phải có ≥ 1 điểm cfg, nếu không ⇒ `E_STALE` (đột biến đã chết, sửa manifest).
#   - `kind = "script"`: chạy thẳng lệnh (self-test tự bảo vệ cây thật).
#   - Đòi ĐỎ (trừ `expect = "pass"`) **và** marker khớp ⇒ `KILLED`; Đỏ mà marker sai
#     ⇒ `E_WRONG-REASON`; XANH ⇒ `SURVIVED` (đột biến sống = lỗ hổng bộ kiểm).
#
# `kind = "build"`: đột biến do `build.rs` cấp `--cfg` (hoặc do **đồ thị feature** Cargo) ⇒ trên
# bản sao công cụ áp `patches` (`file`/`find`/`replace`); `find` không khớp ⇒ `E_STALE`.
#
# **KT-403 r2 (D2-259)** — 43 khai báo feature `mut-*` ad-hoc trong 7 `Cargo.toml` đã **gỡ**;
# manifest là **nguồn duy nhất**. `declarations = 43` = số khai báo đã thay thế (đóng băng tại
# `67b4ee2a`); `--lint` đỏ nếu còn khai báo `mut-*` nào (`E_LEFTOVER`) hoặc `covered != 43`.
# Mọi mục `wired = true` ⇒ `v2 mutants --all` không còn `E_UNWIRED`; `v2 nightly --all` chạy bước
# `mutation` bằng chính `v2 mutants --all`.

version = 1
frozen_at = "2026-11-24"
declarations = 53   # 43 khai báo `mut-*` ad-hoc **đã thay thế** (đóng băng tại `67b4ee2a`; nay = 0 trong cây)
                    # + 3 đột biến **SMP 4 hart** mới của `KT-412` (2026-11-25, `mut-smp-*`)
                    # + 3 đột biến **SMP tầng 2 / range shootdown** của `KT-415` (2026-11-26,
                    #   `mut-tier2-*` + `mut-range-pages-one`)
                    # + 3 đột biến **ring trace `.corespace`** của `KT-408`/`KT-408b` (2026-11-26,
                    #   `mut-ring-*` — nợ §4 mục 4 của journal `kt408-kernelstore-ring.md`)
                    # + 1 đột biến **`Machine::dispatch` trên TCB thật** của `KT-413c` (2026-11-26,
                    #   `mut-dispatch-no-preempt` — D2-261)

[[suite]]
id = "selfbreak"
command = "bash v2/test/rules/selfbreak.sh"
marker = "^# selfbreak: 5/5 ca phá ĐỎ"

[[suite]]
id = "ktest-aarch64"
command = "bash v2/test/boot/run-aarch64.sh 1"
marker = "^not ok |^FAIL|không khớp"

[[suite]]
id = "ktest-x86_64"
command = "bash v2/test/boot/run-x86_64.sh 1"
marker = "^not ok |^FAIL|không khớp"

[[suite]]
id = "ktest-riscv64"
command = "bash v2/test/boot/ktest.sh"
marker = "^not ok |^FAIL|không khớp"

[[suite]]
id = "l1-host"
command = "bash v2/tools/l1-tier.sh --tier smoke"
marker = "MISMATCH|^not ok "

# **KT-403 r2** — hai đột biến `mut-drop-nb-no-waiter`/`mut-state-before-cap` sống trong **unit
# test** của `v2/kernel/vifast-core` (`nb_queue_tests.rs`, KT-342b). Suite này chạy trực tiếp các
# ca đó: `l1-tier --tier smoke` KHÔNG thấy chúng (nó chạy `vifast-sim --test l1_k1c`, không chạy
# unit test của crate core) — trước đây manifest ghi `l1-host` nên `--all` sẽ báo SURVIVED oan.
[[suite]]
id = "core-host"
command = "cargo test --manifest-path v2/kernel/Cargo.toml -p vifast-core --lib nb_queue"
marker = "test result: FAILED|panicked at|^not ok "

# **KT-408b** — suite host cho **ring trace `.corespace`**: bốn ca `kt408_*` của `KT-408`
# (`store` phủ 23 bảng, byte-level bản ghi 32 B, `set_harts`, `Copy`/`Meta`). Chạy trực tiếp
# test của crate (không QEMU) nên 3 đột biến `mut-ring-*` được chấm đúng chỗ; `marker` từng mục
# chỉ đúng **tên ca** phải đỏ (đỏ do hạ tầng/compile không bị tính là KILLED).
[[suite]]
id = "core-ring-host"
command = "cargo test --manifest-path v2/kernel/Cargo.toml -p vifast-core --lib kt408"
marker = "test result: FAILED|panicked at|^not ok "

# **KT-415** — hai suite **host** cho tầng 2 (`HartTier2`) và range shootdown (`range_pages`).
# Chạy trực tiếp test của crate (không QEMU) nên đột biến ở `vifast-plat-common`/`vifast-plat-aarch64`
# được chấm đúng chỗ, không phụ thuộc boot.

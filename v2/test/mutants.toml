# **KT-412** (`D2-259` mục 6) — ba đột biến của **SMP 4 hart** trên `riscv64`. Mỗi móc nằm ở
# `vifast-core` (scheduler/`published`/`set_harts`) và bị bắt bởi **bộ ca SMP dùng chung**
# (`vifast_ktest::smp_suite`, TAP 71..73 của ảnh `ktest`). Cả ba ĐỎ ở `-smp 1` nên suite
# `ktest-riscv64` (mặc định `ktest.sh` = 1 hart) đủ để giết; không cần ma trận `-smp 4`.
# **KT-413c** (`D2-261`) — đột biến của **scheduler core trên TCB thật** mà `x86_64` dùng qua
# `Machine::dispatch(0)`: bỏ bước đưa `current` về `Ready` trước khi chọn. Bị bắt bởi kịch bản
# dispatch của `run-x86_64.sh` (TAP 22..25) nên dùng suite `ktest-x86_64`.
[[mutant]]
id = "mut-dispatch-no-preempt"
title = "Đột biến `mut-dispatch-no-preempt`"
kind = "feature"
feature = "mut-dispatch-no-preempt"
archs = ["x86_64"]
crates = ["vifast-core"]
suite = "ktest-x86_64"
expect = "red"
wired = true
why = "Bỏ `preempt_current` trong `dispatch_step` ⇒ TCB đang chạy vẫn `Running` khi TCB khác được chuyển sang `Running` ⇒ chuỗi lượt chọn sai: đo được `viol=2` ở lượt chọn thứ 2/3 ⇒ TAP 29 `sched: priority` ĐỎ, không marker (log KILLED 2026-11-26: `ok - mut-dispatch-no-preempt: KILLED (318.6 s)`)."


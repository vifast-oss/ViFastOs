# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vifast-sim"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "vifast_sim"
path = "src/lib.rs"

[dependencies]
# Tên/số mã lỗi + enum trạng thái lấy từ code sinh của spec (D2-11), không chép tay.
vifast-abi = { path = "../../lib/vifast-abi" }
# KT-16 (D2-14, D2-47d): object body của sim nằm trong allocator của objmem.
vifast-objmem = { path = "../../lib/vifast-objmem", features = ["heap"] }
# KT-36 (D2-65 Q1/Q2): cỡ Frame + `size_bits` lấy từ crate hình PTE, không chép tay giá trị.
vifast-pte = { path = "../../lib/vifast-pte" }

# KT-403 (D2-09/D2-40): dump trace nhị phân 32 B từ CLI (`--trace-bin`) — cùng định dạng
# `vifast-traceformat` mà kernel/QEMU dùng; bản ghi 32 B + header `VFT1`.
vifast-traceformat = { path = "../../lib/vifast-traceformat", features = ["std"] }

[[bin]]
name = "vifast-sim"
path = "src/main.rs"

[dev-dependencies]
# KT-55: IR conformance (đọc 5 `.scn`) + dòng trace chuẩn hoá dùng chung với kernel.
vifast-scenario = { path = "../../lib/vifast-scenario" }
vifast-traceformat = { path = "../../lib/vifast-traceformat", features = ["std"] }
# KT-58: core kernel `no_std` (K3b tầng 1) — test parity chạy **cùng** kịch bản trên sim
# (oracle) và core; chỉ dev-dependency, không đổi ngữ nghĩa sim.
vifast-core = { path = "../../kernel/vifast-core" }

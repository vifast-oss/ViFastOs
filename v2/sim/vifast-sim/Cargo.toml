# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vifast-sim"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "vifast_sim"
path = "src/lib.rs"

[dependencies]
# Tên/số mã lỗi + enum trạng thái lấy từ code sinh của spec (D2-11), không chép tay.
vifast-abi = { path = "../../lib/vifast-abi" }
# KT-16 (D2-14, D2-47d): object body của sim nằm trong allocator của objmem.
vifast-objmem = { path = "../../lib/vifast-objmem", features = ["heap"] }
# KT-36 (D2-65 Q1/Q2): cỡ Frame + `size_bits` lấy từ crate hình PTE, không chép tay giá trị.
vifast-pte = { path = "../../lib/vifast-pte" }

[[bin]]
name = "vifast-sim"
path = "src/main.rs"

# SPDX-License-Identifier: MIT OR Apache-2.0
# **KT-404** — `vifast-urt`: shim ABI U-mode (`v2/user/runtime/lib.rs`).
#
# `[lib] name = "vifast_user_abi"` **cố ý**: ba `build.rs` của `vifast-kbin-*` truyền
# `--extern vifast_user_abi=<rlib>` cho từng ELF U-mode, và `extern crate vifast_user_abi;` nằm
# trong mọi chương trình. Đổi tên crate sẽ đổi symbol đã mangle ⇒ đổi byte ELF ⇒ đổi ảnh.
[package]
name = "vifast-urt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KT-404: shim ABI U-mode (ecall/svc/int 0x80 + IPC buffer) — no_std, unsafe trong danh sách đóng D2-17"

[lib]
name = "vifast_user_abi"
path = "lib.rs"

[dependencies]

# `--cfg` riêng của từng ảnh do `build.rs` cấp (`shell_fs`, `shell_net`, `shell_exec`,
# `product_net`, `rt_alloc`, `mut_*`). Khai báo để `clippy -D warnings` không báo
# `unexpected_cfgs`; bước `step_user_workspace` của `v2 check` bật đúng bộ cờ của **ảnh sản
# phẩm** qua `RUSTFLAGS` (lint đúng biến thể chạy thật, không lint bản test).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(rt_alloc)",
    "cfg(shell_fs)",
    "cfg(shell_net)",
    "cfg(shell_exec)",
    "cfg(product_net)",
    "cfg(mut_info_x1)",
    "cfg(mut_no_x0_out)",
    "cfg(mut_net_one_caller)",
    "cfg(test)",
] }

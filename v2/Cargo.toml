# Workspace của v2 — tách hẳn workspace v1 (crates/) đã đóng băng (D2-26).
[workspace]
resolver = "2"
exclude = ["kernel"]
members = [
    "lib/vifast-elf",
    "lib/vifast-fs",
    "lib/vifast-fsutil",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"

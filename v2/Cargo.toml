# Workspace của v2 — tách hẳn workspace v1 (crates/) đã đóng băng (D2-26).
[workspace]
resolver = "2"
exclude = ["kernel"]
members = [
    "lib/vifast-abi",
    "lib/vifast-alloc",
    "lib/vifast-objmem",
    "lib/vifast-pte",
    "lib/vifast-scenario",
    "lib/vifast-sync",
    "lib/vifast-traceformat",
    "lib/vifast-elf",
    "lib/vifast-fs",
    "lib/vifast-idl",
    "lib/vifast-ring",
    "lib/vifast-vfs",
    "lib/vifast-virtio",
    "lib/vifast-fsutil",
    "lib/vifast-net",
    "tools/vifast-agentctl",
    "sim/vifast-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"

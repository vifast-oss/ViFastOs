# SPDX-License-Identifier: MIT OR Apache-2.0
# KT-160 (D2-147) — K4' bước 1: phần **host-testable** của platform AArch64.
# Crate **thuần dữ liệu**: không asm, không `cfg(target_arch)`, không `unsafe`, không dependency
# ngoài (D2-21). Phần TTBR/MAIR/TLB/asm của K4' bước 2 nằm ở crate arch như `vifast-plat-riscv64`
# (D2-17) — đêm nay **không** boot aarch64, **không** tuyên bố K4' đạt.
[package]
name = "vifast-plat-aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform AArch64 K4' bước 1: PageTableFormat 4 mức 4 KiB (39-bit VA, 48-bit PA) thuần dữ liệu, host-testable"

[features]
default = []
# **KT-338b** (D2-233/D2-244) — nối `vifast-core::Machine` vào ảnh. Chỉ ảnh **kiểm**
# (`vifast-kbin-aarch64 --features ktest`) bật: trần `.data+.bss` của ảnh **sản phẩm** aarch64 là
# 65.536 B (D2-236) — nhỏ hơn `size_of::<Machine>()` (184.792 B), nên model core **không** lọt vào
# ảnh sản phẩm của task này (KT-339 sẽ quyết định ngân sách khi mở shell sản phẩm).
core = ["dep:vifast-core"]
# **KT-339** — bật transcript `k5cap` (TAP 43 đọc dữ liệu kernel thấy, không tin U-mode). Chỉ ảnh
# **kiểm**; ảnh sản phẩm không bật (không thêm byte `.data+.bss` vào trần 65.536 B).
ktest = []
# **Đột biến (ii) của KT-338b** — `IrqState::save_and_disable` **không** mask `DAIF.I` ⇒ ngắt chạy
# trong vùng găng ⇒ TAP `lock: irq` ĐỎ (`inside_enabled=1`). Chỉ dùng cho đột biến.
mut-no-irq = []
# **KT-339a** — đột biến (i): `Machine` trở lại `.bss` (bỏ `link_section = ".corespace"`) ⇒
# `.data+.bss` của ảnh `product-shell` phình lên bằng `size_of::<Machine>()` ⇒ cổng ngân sách
# phải ĐỎ. Chỉ dùng cho kiểm, **không** phải feature sản phẩm.
mut-machine-bss = []
# **Đột biến (ii) bắt buộc của KT-338b** — `IrqMcsGuard` **bỏ** khôi phục `DAIF` khi nhả khoá ⇒
# TAP `lock: irq` ĐỎ (`after_enabled=0`). Thay cho `mut-leak-unlock` của riscv64 (cùng ý: "quên
# khôi phục trạng thái ngắt khi unlock"). Chỉ dùng cho đột biến — không phải feature sản phẩm.
mut-no-irq-restore = []

[dependencies]
# **KT-338b** — core kernel `no_std` dùng chung 3 arch (D2-233). `optional` + feature `core`:
# ảnh sản phẩm **không** link crate này (cùng lý do `KT-338c` để 4 crate harness là optional).
vifast-core = { path = "../vifast-core", optional = true }
# **KT-338b** — `McsLock` cho `irq_lock::IrqMcsLock` (KT-336a/b/c đã dùng chung 3 port; D2-244).
vifast-sync = { path = "../../lib/vifast-sync" }
# KT-164: trait `PageTableFormat`/`Mmu` + kiểu đi kèm nằm ở crate **dùng chung** `vifast-pte`
# (thiết kế §358/§1101) — crate này chỉ còn impl, không định nghĩa lại (nợ N1 của KT-160 đã đóng).
# Crate nội bộ, `no_std`, không dependency ngoài (D2-21).
vifast-pte = { path = "../../lib/vifast-pte" }
# **KT-338c** (D2-244 tầng 1): doorbell bitmask **chung** 3 port — `IpiMailbox`/`IpiKind` nằm ở
# `vifast-plat-common` (đã host-test 452/452). Crate arch chỉ **dùng** bitmask + gửi `SGI`.
vifast-plat-common = { path = "../vifast-plat-common" }
# **KT-273** (K4' bước 3, PCI ECAM + virtio-blk): phần **thuần** của virtio-pci/virtio-blk
# (BAR mask, capability list, split queue, request header) đã có ở `vifast-virtio` từ KT-72 —
# crate arch **dùng lại**, không chép logic sang bản thứ hai (D2-110A). Crate đó `no_std`,
# `forbid(unsafe_code)`, không dependency ngoài.
vifast-virtio = { path = "../../lib/vifast-virtio" }
# **KT-339** — ring chia sẻ KT-69: kernel bơm script vào ring của shell bằng **cùng** crate
# (`vifast-ring` + codec `conchan` của `vifast-virtio`) mà chương trình U-mode dùng. `no_std`,
# không `unsafe`, không dependency ngoài.
vifast-ring = { path = "../../lib/vifast-ring" }
# **KT-339** — parser ELF64 **duy nhất** của repo (D2-26): loader aarch64 dùng lại
# `vifast_elf::parse`, không có parser thứ hai. `no_std`, `forbid(unsafe_code)`.
vifast-elf = { path = "../../lib/vifast-elf" }
# **KT-275** (K4' bước 3, D1 trên aarch64): codec mạng **thuần** (Ethernet/ARP/IPv4/ICMP/UDP/
# DHCP) — `no_std`, `deny(unsafe_code)`, không dependency ngoài (D2-21), 58 test host. Driver
# `virtio_net` của crate này chỉ còn phần MMIO/queue/DMA + chính sách client; **không** có bản
# sao codec nào trong kernel (cùng lý do KT-246b đã de-dup bên riscv64).
vifast-net = { path = "../../lib/vifast-net" }

# Workspace bare-metal của kernel (KT-07). Tách hẳn workspace host ở v2/Cargo.toml:
# `gate --fast` chỉ build phần chạy được trên host; ảnh boot build riêng cho
# riscv64gc-unknown-none-elf qua `v2/test/boot/run.sh`.
[workspace]
resolver = "2"
# **KT-404** — `vifast-kbuild` là crate **host** (dùng `std`: `Command`/`fs`/`env`) làm
# `[build-dependencies]` cho 3 `vifast-kbin-*`. Nó **không** phải thành viên workspace bare-metal:
# `cargo check --workspace --target riscv64gc-unknown-none-elf` (bước `wake theo dep-info`,
# KT-217) sẽ cố build nó cho riscv64 và ĐỎ. Build-dependency luôn được biên dịch cho **host** nên
# chỉ cần là path-dependency; `exclude` + `[workspace]` riêng trong crate đó là cách cargo
# diễn đạt "host-only helper".
exclude = ["vifast-kbuild"]
members = [
    "vifast-core",
    "vifast-kbin-aarch64",
    "vifast-kbin-riscv64",
    "vifast-kbin-x86_64",
    "vifast-plat-aarch64",
    "vifast-plat-common",
    "vifast-plat-riscv64",
    "vifast-plat-riscv64-logic",
    "vifast-plat-x86_64",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

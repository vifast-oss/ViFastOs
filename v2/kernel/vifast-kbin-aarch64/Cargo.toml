# SPDX-License-Identifier: MIT OR Apache-2.0
# KT-247 (D2-195) — K4' bước 3, B3.1: ảnh boot **aarch64** đầu tiên của ViFastOs.
#
# Phạm vi: linker script + `_start` + PL011 + `PSCI SYSTEM_OFF`. **Không** MMU, **không** bảng
# vector, **không** U-mode (ba việc đó là KT-248/249). Ảnh nạp trực tiếp bằng
# `qemu-system-aarch64 -M virt -kernel <elf>` (D2-195 Q1: `-kernel` trực tiếp, không AAVMF/UEFI).
#
# Vì sao **không** dùng feature như `vifast-kbin-riscv64`: bước 3 mới có **một** ảnh; tách ảnh
# test/sản phẩm là việc của bước sau (D2-08 vẫn áp: ảnh này không chứa harness nào).
[package]
name = "vifast-kbin-aarch64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ảnh boot aarch64 K4' bước 3 (KT-247): linker script + _start + PL011 + PSCI halt, nạp qua QEMU virt -kernel"

[[bin]]
name = "vifast-kbin-aarch64"
path = "src/main.rs"

[features]
# **KT-338c** (D2-08) — bật harness/TAP cho ảnh **kiểm** `vifast-kbin-ktest-aarch64`. Ảnh sản
# phẩm (**không** feature này) rẽ vào `product::boot` và **không** biên dịch mô-đun nào của
# harness ⇒ 0 harness marker (runner quét `strings` + ca âm).
ktest = [
    "dep:vifast-plat-common",
    "dep:vifast-abi",
    "dep:vifast-virtio",
    "dep:vifast-net",
    # **KT-338b** — `vifast-core::Machine` + `SyscallEnv` của crate arch (D2-233/D2-244). Chỉ ảnh
    # kiểm: trần `.data+.bss` sản phẩm aarch64 là 65.536 B, nhỏ hơn `size_of::<Machine>()`.
    "vifast-plat-aarch64/core",
    # **KT-339** — transcript `k5cap` (TAP 43 đọc hash các lần `put` thay vì tin hàng IPC của TCB
    # thoát, vốn bị `Machine::exit` dọn).
    "vifast-plat-aarch64/ktest",
    "dep:vifast-core",
]
# **Đột biến (i)** — chèn **một** marker harness vào ảnh sản phẩm ⇒ `harness-scan` của runner
# phải ĐỎ. Chỉ dùng cho đột biến, **không** phải feature sản phẩm.
mut-harness-marker = []
# **Đột biến (ii)** — `.bss` cố ý vượt trần **64 KiB** của ảnh sản phẩm ⇒
# `budget-aarch64.sh --product` phải ĐỎ. Chỉ dùng cho đột biến.
mut-big-bss = []
# **Đột biến (ii) của KT-338b** — bỏ khôi phục `DAIF` khi nhả khoá ⇒ TAP **41** phải ĐỎ
# (`irq_after=0`). Chỉ dùng cho đột biến, chuyển tiếp xuống crate arch.
mut-no-irq-restore = ["vifast-plat-aarch64/mut-no-irq-restore"]
# **Đột biến phụ** — không mask `DAIF.I` khi giữ khoá ⇒ TAP **41** đỏ (`irq_inside=1`).
mut-no-irq = ["vifast-plat-aarch64/mut-no-irq"]
# **Đột biến (i) của KT-339** — shim `vifast-plat-user` đặt `MessageInfo` ở `x1` thay `x2`
# (giả lập riscv64): kernel aarch64 đọc `x2` ⇒ message K5 sai label/length ⇒ TAP 43/44 ĐỎ.
mut-info-x1 = []
# **Đột biến (ii) của KT-339** — stub `invoke` **không** ghi lại `x0` (error): `procsrv` đọc
# `error` cũ (cap) ⇒ coi mọi `NBRecv` thành công là `Busy` ⇒ TAP 42 ĐỎ (timeout ngân sách).
mut-no-x0-out = []

[dependencies]
# Toàn bộ asm/MMIO nằm ở crate arch (D2-17); ảnh này **không** có `unsafe`.
vifast-plat-aarch64 = { path = "../vifast-plat-aarch64" }
# **KT-338b** — core kernel dùng chung 3 arch (D2-233): ảnh kiểm dựng `Machine`, gọi
# `syscall::dispatch` từ vector `svc`, và kiểm `Tcb.*`/IPC. `optional` + bật trong `ktest` để ảnh
# sản phẩm **không** kéo model 184.792 B `.bss` vào (trần 65.536 B — xem `budget-aarch64.sh`).
vifast-core = { path = "../vifast-core", optional = true }
# KT-254 (B3.5): `FaultKind` ABI (`Vm{vspace,va,access,reason}`) + `vm_reason` nằm ở
# `vifast-plat-common::fault` (D2-56a) — ảnh dựng **đúng** kiểu ABI từ kết quả giải mã ESR/FAR
# của crate arch (`vifast_plat_aarch64::fault`), không định nghĩa lại `FaultKind` thứ hai.
# Chỉ ảnh (leaf) kéo crate này; crate arch **không** phụ thuộc ngược (tránh vòng dev-dep).
# **KT-338c** (D2-08): chỉ ảnh **kiểm** cần `vifast-plat-common` (ABI `FaultKind`, `IpiMailbox`
# của doorbell — D2-244). Để `optional` + bật trong feature `ktest` ⇒ ảnh sản phẩm **không**
# link crate này, nên bảng ABI/harness không thể lọt vào ảnh sản phẩm qua đường phụ thuộc.
vifast-plat-common = { path = "../vifast-plat-common", optional = true }
# **KT-269** (D2-206): số hiệu syscall của U-mode lấy từ **hằng sinh** `vifast-gen`
# (`SYS_DEBUG_PUT_STR`, `SYS_EXIT`) — không chép tay 12/14 (D2-11). Crate `no_std`, không
# dependency ngoài; `global_asm!` nhận `const` operand nên stub EL0 đổi theo spec.
vifast-abi = { path = "../../lib/vifast-abi", optional = true }
# **KT-275** (K4' bước 3, D1 trên aarch64): bước mạng dùng thẳng **kiểu** của hai crate thuần đã
# có host test — `vifast_virtio::features::DRIVER_OK` (bit `device_status` phải đọc lại) +
# `vifast_net::addr::{Ipv4Addr, MacAddr}` (định dạng địa chỉ trong dòng evidence). Không chép lại
# hằng/kiểu nào của hai crate này vào ảnh (cùng lý do KT-274 đã làm bên x86_64).
vifast-virtio = { path = "../../lib/vifast-virtio", optional = true }
vifast-net = { path = "../../lib/vifast-net", optional = true }

# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "vifast-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core kernel no_std (K3b/KT-58): Untyped + CNode + MDB + capability port từ sim, không unsafe, không alloc"

[dependencies]
# D2-11: hằng số ABI (48 B slot, cỡ object, 16 syscall, 19 error) sinh từ `spec/abi.toml`,
# không chép tay sang core.
vifast-abi = { path = "../../lib/vifast-abi" }
# **KT-408** — kho ring trace 32 B **luôn bật** (`D2-09`): định dạng + kho `.corespace` NOLOAD do
# crate `KT-12`/`KT-403` sở hữu (`D2-38`/`D2-42`). `default-features = false` ⇒ `no_std`, 0 dep
# ngoài (path dep nội bộ, không crates.io).
vifast-traceformat = { path = "../../lib/vifast-traceformat", default-features = false }

[features]
# **KT-403 r2 (D2-259)** — mọi đột biến `mut-*` do `v2/test/mutants.toml` điều khiển:
# công cụ lật cfg trên **bản sao** của cây; **KHÔNG** khai báo feature `mut-*` ở đây nữa.
# **KT-342b** — hai đột biến **ĐỎ** cho phép kiểm bảo toàn message `NBSend`
# (`nb_queue_tests.rs`; D2-05). Mỗi feature chỉ dựng lại một nhánh **sai** — không dùng ở sản phẩm.
#
# (i) `NBSend` **bỏ** message khi Endpoint không có người chờ (mô phỏng đúng "message rơi" mà
#     KT-342 gặp) ⇒ ca 1 + ca 2 đỏ.
# (ii) `nb_send` kiểm **trạng thái TCB trước** kiểm cap (đảo thứ tự ưu tiên lỗi cap) ⇒ ca 4 đỏ.

[lints.rust]
# **KT-403 r2 (D2-259)** — `#[cfg(feature = "mut-*")]` là **móc đột biến**: `v2/test/mutants.toml`
# lật cfg đó trên **bản sao** của cây, nên feature không còn được khai báo ở đây. rustc coi tên đó
# là "unexpected cfg" và `-D warnings` biến nó thành lỗi ⇒ cho phép **đúng một** lint này.
# KHÔNG nới ngưỡng, KHÔNG tắt test nào (D2-113F).
unexpected_cfgs = "allow"

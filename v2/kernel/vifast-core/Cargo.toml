[package]
name = "vifast-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core kernel no_std (K3b/KT-58): Untyped + CNode + MDB + capability port từ sim, không unsafe, không alloc"

[dependencies]
# D2-11: hằng số ABI (48 B slot, cỡ object, 16 syscall, 19 error) sinh từ `spec/abi.toml`,
# không chép tay sang core.
vifast-abi = { path = "../../lib/vifast-abi" }

[features]
# **KT-342b** — hai đột biến **ĐỎ** cho phép kiểm bảo toàn message `NBSend`
# (`nb_queue_tests.rs`; D2-05). Mỗi feature chỉ dựng lại một nhánh **sai** — không dùng ở sản phẩm.
#
# (i) `NBSend` **bỏ** message khi Endpoint không có người chờ (mô phỏng đúng "message rơi" mà
#     KT-342 gặp) ⇒ ca 1 + ca 2 đỏ.
mut-drop-nb-no-waiter = []
# (ii) `nb_send` kiểm **trạng thái TCB trước** kiểm cap (đảo thứ tự ưu tiên lỗi cap) ⇒ ca 4 đỏ.
mut-state-before-cap = []

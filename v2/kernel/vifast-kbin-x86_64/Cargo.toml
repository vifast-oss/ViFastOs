# SPDX-License-Identifier: MIT OR Apache-2.0
# KT-257 (K5' bước 1) — ảnh boot **x86_64** đầu tiên của ViFastOs.
#
# Phạm vi: linker script + multiboot2 header + PVH note + `_start` 32-bit + bảng trang long mode
# + COM1 + ACPI shutdown. **Không** IDT/GDT đầy đủ (chỉ GDT tối thiểu để vào long mode), **không**
# APIC, **không** timer, **không** U-mode, **không** PCI, **không** SMP — đó là K5' đầy đủ.
#
# Vì sao **không** feature như `vifast-kbin-riscv64`: bước 1 mới có **một** ảnh; tách ảnh
# test/sản phẩm là việc của bước sau (D2-08 vẫn áp: ảnh này không chứa harness nào).
#
# Feature `wrong-marker` **chỉ** để runner `v2/test/boot/run-x86_64.sh` có **ca âm bằng ảnh thật**:
# nó đổi đúng một chuỗi marker, mọi thứ khác giữ nguyên. Không phải feature sản phẩm.
[package]
name = "vifast-kbin-x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ảnh boot x86_64 K5' bước 1 (KT-257): multiboot2 + PVH note + _start 32-bit + long mode + COM1 + ACPI halt"

[[bin]]
name = "vifast-kbin-x86_64"
path = "src/main.rs"

[features]
# Ca âm của runner: ảnh in marker **sai** để chứng minh bộ kiểm không phải dấu cao su.
wrong-marker = []
# **KT-276** — đột biến (i): **không** gửi `SIPI` (chỉ `INIT`). Hart phụ không bao giờ vào long
# mode ⇒ TAP 18 ĐỎ, không marker. Chỉ dùng để chứng minh bộ kiểm có răng, **không** phải feature
# sản phẩm (runner không build nó).
no-sipi = []
# **KT-276** — đột biến (ii): `SIPI` tới **vector sai** (`0x09` ⇒ 0x9000 thay vì 0x8000). Hart phụ
# chạy vào rác, không online; BSP hết trần 2 s ⇒ TAP 18 ĐỎ, không marker (QEMU không tự thoát —
# treo có kiểm soát, runner timeout giết). Chỉ dùng cho đột biến.
bad-trampoline = []
# **KT-278** — đột biến (i) của IPI: **không** gửi IPI. Hart 1 không nhận ⇒ `# smp: ipi recv=`
# không xuất hiện, `SMP_IPI_COUNT = 0` ⇒ TAP 20 ĐỎ (không marker). Chỉ dùng cho đột biến.
no-ipi = []
# **KT-278** — đột biến (ii) của IPI: gửi tới `APIC ID = 7` — hart **không tồn tại** với `-smp 4`.
# Không ai nhận ⇒ BSP hết trần 100 ms rồi **đi tiếp** (không treo) ⇒ TAP 20 ĐỎ. Chỉ dùng cho
# đột biến.
bad-ipi-dest = []
# **KT-278** — đột biến (iii) của TSS per-hart: descriptor TSS của hart phụ trỏ **TSS của hart 0**
# (trùng địa chỉ). Không fault, nhưng phép **kiểm địa chỉ** của BSP thấy trùng ⇒ TAP 19 ĐỎ.
# Chỉ dùng cho đột biến.
same-tss = []
# **KT-301** — kiểm **đỏ-trước** của `wait_ipi`: hart đích **nhận** IPI nhưng trì hoãn việc tăng
# bộ đếm **150 ms** (đo bằng PIT kênh 2) — mô phỏng **tất định** độ trễ lập lịch của host đã làm
# boot 422/600 của KT-298 đỏ (`waited_us=u64::MAX` trước khi `# smp: ipi recv=1` in ra). Trước
# KT-301 (`wait_ipi` trần **thời gian** 100 ms) ⇒ TAP 20 ĐỎ; sau KT-301 (chờ **biến đếm**) ⇒ TAP
# 20 XANH. Chỉ dùng cho kiểm, **không** phải feature sản phẩm.
slow-ipi = []
# **KT-301** — đột biến (ii): hart đích **nhận** IPI và in `# smp: ipi recv=1` nhưng **không**
# tăng `SMP_IPI_COUNT` ⇒ BSP chờ hết **trần số vòng** rồi đi tiếp (TAP 20 ĐỎ, **không treo**).
# Chứng minh trần số vòng là **hữu hạn** và điều kiện dừng là **biến đếm**, không phải thời gian.
# Chỉ dùng cho đột biến.
no-ipi-count = []
# **KT-286** — đột biến (i) của preemption: sau tick đầu **không** gọi `schedule()` nữa ⇒ chỉ tác
# vụ A chạy, `main` không bao giờ được nhường lại ⇒ không có `# sched: ticks=…`/marker (ĐỎ).
# Chỉ dùng cho đột biến.
no-preempt = []
# **KT-286** — đột biến (ii): nạp `rsp` của tác vụ kế bằng địa chỉ **chưa map** thay vì frame đã
# lưu. KT-286 ghi kỳ vọng "`#PF` rồi `#DF`"; **KT-298** thêm phép kiểm frame trước `iretq` nên
# đột biến này nay bị **bắt sớm**: ảnh in `# sched: BAD frame slot=… rsp=0x700000000000 …` rồi
# `halt` (ĐỎ, không marker) — **không** còn `#PF`/`#DF`. Đây là hành vi **tốt hơn** (đỏ có
# chẩn đoán thay vì đỏ bằng triple-fault), không phải nới ngưỡng: bất biến của runner vẫn là
# "không marker ⇒ ĐỎ". Chỉ dùng cho đột biến.
bad-rsp = []
# **KT-286** — đột biến (iii): không `EOI` trong handler timer ⇒ LAPIC giữ ISR bit ⇒ timer **tắt
# sau tick đầu** ⇒ TAP 10 `timer: ticks` ĐỎ. Chỉ dùng cho đột biến.
no-eoi = []
# **KT-297** — đột biến (i) của phép kiểm timer: **không** nạp `LAPIC_TIMER_INITIAL_COUNT` ⇒
# counter đứng yên ở 0 ⇒ `runs=0` **thật** ⇒ TAP 10 ĐỎ. Chứng minh phép kiểm periodic mới không
# phải dấu cao su (trước KT-297, `runs` chỉ so `count1 < count0`). Chỉ dùng cho đột biến.
no-lapic-timer = []
# **KT-297** — đột biến (ii): nạp PIT kênh 0 divisor **nhỏ hơn 10×** ⇒ tick 1.000 Hz ⇒ `hz` đo
# được ngoài `HZ_MAX` ⇒ TAP 10 ĐỎ. Chứng minh cổng bắt được timer **sai nhịp** (trước KT-297
# cổng chỉ đòi `hz > 0`). Chỉ dùng cho đột biến.
wrong-hz = []
# **KT-288** — đột biến (ii) của virtio-blk: chữ ký sector 0 sai ⇒ `magic=0` ⇒ TAP 25 ĐỎ (hex vẫn
# đúng — lớp lỗi "đọc được nhưng không nhận ra chữ ký"). Chỉ dùng cho đột biến.
bad-blk-magic = []
# **KT-288** — đột biến (iii) của virtio-blk: BAR lấy **sai leaf** (địa chỉ chưa map) ⇒ lần đọc
# common config đầu tiên `#PF` ⇒ ảnh halt, không marker (ĐỎ). Chỉ dùng cho đột biến.
bad-blk-bar = []

[dependencies]
# Toàn bộ asm/MMIO nằm trong `global_asm!` của ảnh này (không cần `unsafe`); dữ liệu (offset
# thanh ghi, entry bảng trang, GDT, header) lấy từ crate arch để test host chốt đúng giá trị.
vifast-plat-x86_64 = { path = "../vifast-plat-x86_64" }
# **KT-270** (D2-207): số hiệu syscall của U-mode lấy từ **hằng sinh** `vifast-gen`
# (`SYS_DEBUG_PUT_STR`, `SYS_EXIT`) — không chép tay 12/14 (D2-11). Crate `no_std`, không
# dependency ngoài; `global_asm!` nhận `const` operand nên stub ring 3 đổi theo spec.
vifast-abi = { path = "../../lib/vifast-abi" }
# **KT-274** (D2-208): bước PCI/net dùng thẳng **kiểu** của hai crate thuần đã có host test —
# `vifast_virtio::pci::VirtioKind` (loại thiết bị cần tìm) + `vifast_virtio::features::DRIVER_OK`
# (bit `device_status` phải đọc lại) + `vifast_net::addr::Ipv4Addr` (địa chỉ slirp). Không chép
# lại hằng/kiểu nào của hai crate này vào ảnh.
vifast-virtio = { path = "../../lib/vifast-virtio" }
vifast-net = { path = "../../lib/vifast-net" }

# SPDX-License-Identifier: MIT OR Apache-2.0
# KT-257 (K5' bước 1) — ảnh boot **x86_64** đầu tiên của ViFastOs.
#
# Phạm vi: linker script + multiboot2 header + PVH note + `_start` 32-bit + bảng trang long mode
# + COM1 + ACPI shutdown. **Không** IDT/GDT đầy đủ (chỉ GDT tối thiểu để vào long mode), **không**
# APIC, **không** timer, **không** U-mode, **không** PCI, **không** SMP — đó là K5' đầy đủ.
#
# **KT-340a** (D2-08) — tách ảnh **sản phẩm** vs **ktest** bằng feature, cùng khuôn
# `vifast-kbin-riscv64`: build **không** feature = ảnh sản phẩm (0 harness marker; `kmain` rẽ vào
# `product::boot` trước dòng TAP đầu tiên), build `--features ktest` = ảnh kiểm giữ đủ TAP hiện có.
# Cùng một `[[bin]]` nhưng **hai artefact**: runner copy ảnh ktest ra tên riêng
# `vifast-kbin-ktest-x86_64` để không trộn với ảnh sản phẩm (xem `run-x86_64.sh`).
#
# Feature `wrong-marker` **chỉ** để runner `v2/test/boot/run-x86_64.sh` có **ca âm bằng ảnh thật**:
# nó đổi đúng một chuỗi marker, mọi thứ khác giữ nguyên. Không phải feature sản phẩm.
[package]
name = "vifast-kbin-x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ảnh boot x86_64 K5' bước 1 (KT-257): multiboot2 + PVH note + _start 32-bit + long mode + COM1 + ACPI halt"

[[bin]]
name = "vifast-kbin-x86_64"
path = "src/main.rs"

[features]
# **KT-403 r2 (D2-259)** — mọi đột biến `mut-*` do `v2/test/mutants.toml` điều khiển:
# công cụ lật cfg trên **bản sao** của cây; **KHÔNG** khai báo feature `mut-*` ở đây nữa.
# **KT-340a** (D2-08): bật harness/TAP cho **ảnh kiểm** `vifast-kbin-ktest-x86_64`. Ảnh sản phẩm
# (**không** feature này) không chứa mã/chuỗi kiểm — `kmain` rẽ vào `product::boot` (trả `!`).
ktest = [
    # **KT-340c** — `vifast-core::Machine` + `SyscallEnv` của crate arch (D2-233/D2-244/D2-247).
    # **KT-341**: ảnh kiểm cũng chạy đường shell sản phẩm để có TAP 44/45 trên **cùng** mã.
    "vifast-plat-x86_64/core",
    "dep:vifast-core",
    "dep:vifast-elf",
    "shell",
]
# **KT-341** — nền **shell sản phẩm dùng chung** (`vifast-plat-user/programs/shell.rs`): `Machine`
# (NOLOAD `.corespace`), loader ELF, rig `int 0x80`, ring KT-69. Bật bởi ảnh **sản phẩm**
# (`--features product-shell`) và bởi `ktest` (TAP 44/45 trên cùng mã). Ảnh sản phẩm mặc định
# (không feature) giữ nguyên đường tối giản tới marker — D2-08 vẫn tách hai artefact.
shell = ["vifast-plat-x86_64/core", "dep:vifast-core", "dep:vifast-elf"]
# **KT-341** — ảnh **sản phẩm** có shell: bật `shell` cho nhánh `product::boot`.
product-shell = ["shell"]
# **KT-341** — đột biến (i): `Machine` trở lại `.bss` (bỏ `link_section`) ⇒ `.data+.bss` ảnh sản
# phẩm vượt 65.536 B ⇒ `budget-x86_64.sh` **ĐỎ**. Chuyển tiếp xuống crate arch.
# **KT-341** — đột biến (ii): `int 0x80` của **core** bị tắt trên ảnh sản phẩm (`DebugPutStr`/
# `Exit` không tới `vifast_core::syscall::dispatch`) ⇒ shell **không** in prompt/help ⇒ TAP 44/45
# ĐỎ (ngân sách `Yield` hết ⇒ kernel in `# k5 fail` rồi halt, không marker). Chỉ dùng cho kiểm.
# **KT-340b** — đột biến (i) của `.bss`: tám **bảng trang boot** rơi về `.bss` (bỏ
# `link_section = ".bootpt"` trong `src/bootpt.rs`) ⇒ `.data+.bss` 43.072 + 32.768 = 75.840 B
# > 65.536 B ⇒ `budget-x86_64.sh` **ĐỎ**. Hành vi boot **không đổi** — chứng minh phép đo ngân
# sách là thứ duy nhất bắt được nó. Chỉ dùng cho đột biến, **không** phải feature sản phẩm.
# **KT-340b** — đột biến (ii) của `VSpace`: `map`/`unmap` **không** `invlpg` sau khi đổi
# entry. Ca `# vspace: remap` (đọc lại cùng VA sau khi đổi frame) sẽ đọc ra dữ liệu **cũ** từ TLB
# ⇒ probe PANIC (ĐỎ). Chuyển tiếp xuống crate arch.
no-invlpg = ["vifast-plat-x86_64/no-invlpg"]
# **KT-340b** — đột biến (iii) của ca **cô lập**: `VSpace` A map **luôn** `VSPACE_PEER_VA` → frame
# của tác vụ B (mô phỏng "bảng trang dùng chung" như trước KT-340b). Lệnh ghi từ ring 3 **không**
# fault ⇒ không có `# vspace: cross fault`, frame peer bị ghi đè ⇒ `vspace_ok=0` ⇒ TAP 14 **ĐỎ**
# (không marker). Chứng minh ca cô lập có răng. Chỉ dùng cho đột biến.
# **KT-340d** — đột biến (i): bỏ **gửi** `TlbFlush` cho hart khác trong `VSpace::flush_va` (vẫn
# `INVLPG` cục bộ) ⇒ TLB của hart kia còn ánh xạ cũ ⇒ ca `# tlb: shootdown` **ĐỎ** (`obs` = dữ
# liệu cũ, `ack=0`). Đột biến trực tiếp của lỗi v1 N5. Chuyển tiếp xuống crate arch.
# **KT-340d** — đột biến (ii): handler IPI **bỏ `invlpg`** nhưng vẫn ACK ⇒ ca `# tlb: shootdown`
# **ĐỎ** (`ack=1` mà `obs` vẫn là dữ liệu cũ) — chứng minh "ACK" một mình không phải bằng chứng.
# **KT-340d** — đột biến (iii): vòng chờ ACK **không** `drain` hộp thư của chính mình (đúng lỗi
# v1 N5 "hart chờ ack mà không xử lý hộp thư") ⇒ ca `# tlb: chain` **ĐỎ** (`ack=0`).
# **KT-340c** — đột biến (i) của `7C-r13`: `syscall_dispatch` ghi `MessageInfo` trả về vào
# **`r12`** (và MR3 vào `r13`) ⇒ chương trình ring 3 đọc `r13` không thấy info, `r12` mất MR3 ⇒
# TAP 41 ĐỎ. Đột biến **trực tiếp** của D2-242 nhóm 7 ("MessageInfo ở r13"). Chỉ dùng cho kiểm.
# **KT-340c** — đột biến (ii): `IrqState::restore` **bỏ** `sti` (chuyển tiếp feature của crate
# arch) ⇒ sau khi nhả khoá `RFLAGS.IF` vẫn 0 ⇒ TAP 43 `lock: RFLAGS.IF` ĐỎ (`irq_after=0`).
# **KT-340a** — đột biến (i) W^X: **không** bật (`CR0.WP=0`, `.text` RWX) ⇒ TAP 35/36 ĐỎ.
no-wx = []
# **KT-340a** — đột biến (ii) W^X: bỏ `NX` trên `.data/.bss` ⇒ trang dữ liệu **exec** ⇒ TAP 35 ĐỎ.
wx-data-exec = []
# Ca âm của runner: ảnh in marker **sai** để chứng minh bộ kiểm không phải dấu cao su.
wrong-marker = []
# **KT-276** — đột biến (i): **không** gửi `SIPI` (chỉ `INIT`). Hart phụ không bao giờ vào long
# mode ⇒ TAP 18 ĐỎ, không marker. Chỉ dùng để chứng minh bộ kiểm có răng, **không** phải feature
# sản phẩm (runner không build nó).
no-sipi = []
# **KT-276** — đột biến (ii): `SIPI` tới **vector sai** (`0x09` ⇒ 0x9000 thay vì 0x8000). Hart phụ
# chạy vào rác, không online; BSP hết trần 2 s ⇒ TAP 18 ĐỎ, không marker (QEMU không tự thoát —
# treo có kiểm soát, runner timeout giết). Chỉ dùng cho đột biến.
bad-trampoline = []
# **KT-278** — đột biến (i) của IPI: **không** gửi IPI. Hart 1 không nhận ⇒ `# smp: ipi recv=`
# không xuất hiện, `SMP_IPI_COUNT = 0` ⇒ TAP 20 ĐỎ (không marker). Chỉ dùng cho đột biến.
no-ipi = []
# **KT-278** — đột biến (ii) của IPI: gửi tới `APIC ID = 7` — hart **không tồn tại** với `-smp 4`.
# Không ai nhận ⇒ BSP hết trần 100 ms rồi **đi tiếp** (không treo) ⇒ TAP 20 ĐỎ. Chỉ dùng cho
# đột biến.
bad-ipi-dest = []
# **KT-278** — đột biến (iii) của TSS per-hart: descriptor TSS của hart phụ trỏ **TSS của hart 0**
# (trùng địa chỉ). Không fault, nhưng phép **kiểm địa chỉ** của BSP thấy trùng ⇒ TAP 19 ĐỎ.
# Chỉ dùng cho đột biến.
same-tss = []
# **KT-301** — kiểm **đỏ-trước** của `wait_ipi`: hart đích **nhận** IPI nhưng trì hoãn việc tăng
# bộ đếm **150 ms** (đo bằng PIT kênh 2) — mô phỏng **tất định** độ trễ lập lịch của host đã làm
# boot 422/600 của KT-298 đỏ (`waited_us=u64::MAX` trước khi `# smp: ipi recv=1` in ra). Trước
# KT-301 (`wait_ipi` trần **thời gian** 100 ms) ⇒ TAP 20 ĐỎ; sau KT-301 (chờ **biến đếm**) ⇒ TAP
# 20 XANH. Chỉ dùng cho kiểm, **không** phải feature sản phẩm.
slow-ipi = []
# **KT-301** — đột biến (ii): hart đích **nhận** IPI và in `# smp: ipi recv=1` nhưng **không**
# tăng `SMP_IPI_COUNT` ⇒ BSP chờ hết **trần số vòng** rồi đi tiếp (TAP 20 ĐỎ, **không treo**).
# Chứng minh trần số vòng là **hữu hạn** và điều kiện dừng là **biến đếm**, không phải thời gian.
# Chỉ dùng cho đột biến.
no-ipi-count = []
# **KT-286** — đột biến (i) của preemption: sau tick đầu **không** gọi `schedule()` nữa ⇒ chỉ tác
# vụ A chạy, `main` không bao giờ được nhường lại ⇒ không có `# sched: ticks=…`/marker (ĐỎ).
# Chỉ dùng cho đột biến.
no-preempt = []
# **KT-286** — đột biến (ii): nạp `rsp` của tác vụ kế bằng địa chỉ **chưa map** thay vì frame đã
# lưu. KT-286 ghi kỳ vọng "`#PF` rồi `#DF`"; **KT-298** thêm phép kiểm frame trước `iretq` nên
# đột biến này nay bị **bắt sớm**: ảnh in `# sched: BAD frame slot=… rsp=0x700000000000 …` rồi
# `halt` (ĐỎ, không marker) — **không** còn `#PF`/`#DF`. Đây là hành vi **tốt hơn** (đỏ có
# chẩn đoán thay vì đỏ bằng triple-fault), không phải nới ngưỡng: bất biến của runner vẫn là
# "không marker ⇒ ĐỎ". Chỉ dùng cho đột biến.
bad-rsp = []
# **KT-286** — đột biến (iii): không `EOI` trong handler timer ⇒ LAPIC giữ ISR bit ⇒ timer **tắt
# sau tick đầu** ⇒ TAP 10 `timer: ticks` ĐỎ. Chỉ dùng cho đột biến.
no-eoi = []
# **KT-297** — đột biến (i) của phép kiểm timer: **không** nạp `LAPIC_TIMER_INITIAL_COUNT` ⇒
# counter đứng yên ở 0 ⇒ `runs=0` **thật** ⇒ TAP 10 ĐỎ. Chứng minh phép kiểm periodic mới không
# phải dấu cao su (trước KT-297, `runs` chỉ so `count1 < count0`). Chỉ dùng cho đột biến.
no-lapic-timer = []
# **KT-297** — đột biến (ii): nạp PIT kênh 0 divisor **nhỏ hơn 10×** ⇒ tick 1.000 Hz ⇒ `hz` đo
# được ngoài `HZ_MAX` ⇒ TAP 10 ĐỎ. Chứng minh cổng bắt được timer **sai nhịp** (trước KT-297
# cổng chỉ đòi `hz > 0`). Chỉ dùng cho đột biến.
wrong-hz = []
# **KT-288** — đột biến (ii) của virtio-blk: chữ ký sector 0 sai ⇒ `magic=0` ⇒ TAP 25 ĐỎ (hex vẫn
# đúng — lớp lỗi "đọc được nhưng không nhận ra chữ ký"). Chỉ dùng cho đột biến.
bad-blk-magic = []
# **KT-288** — đột biến (iii) của virtio-blk: BAR lấy **sai leaf** (địa chỉ chưa map) ⇒ lần đọc
# common config đầu tiên `#PF` ⇒ ảnh halt, không marker (ĐỎ). Chỉ dùng cho đột biến.
bad-blk-bar = []
# **KT-304** — đột biến (i) của tác vụ ring 3: **không** nạp `TSS.RSP0` cho tác vụ U (nạp 0).
# Tick timer đầu tiên từ CPL3 đẩy frame vào địa chỉ 0 ⇒ `#DF` (vector 8) ⇒ ảnh halt, không
# marker (ĐỎ). Chứng minh `RSP0` là **bắt buộc** khi vào ring 3 từ scheduler. Chỉ dùng cho đột biến.
no-rsp0 = []
# **KT-304** — đột biến (ii): `switch_frame_ok` **từ chối** frame ring 3 (`cs = 0x1B`) ⇒ lần
# chuyển sang tác vụ U in `# sched: BAD frame slot=3 …` rồi halt, không marker (ĐỎ). Chứng minh
# nhánh ring 3 của phép kiểm frame là **có răng**. Chỉ dùng cho đột biến.
reject-user-cs = []
# **KT-310** — đột biến (i) của pha nhiều hart: hart **phụ** không gọi `schedule()` (chỉ BSP) ⇒
# `MH_PICKS[1] = 0` ⇒ TAP 25 `sched: multi-hart` ĐỎ, không marker. Chứng minh phép kiểm **đòi**
# hart thứ hai thật, không phải "một hart chạy rồi tự khen". Chỉ dùng cho đột biến.
bsp-only-sched = []
# **KT-315** — đột biến (i') của pha nhiều hart: chỉ **BSP + hart 1** gọi `schedule()`, hart 2/3
# vẫn `hlt` ⇒ dòng tổng hợp in `harts=2` (số **đo**, không phải hằng) ⇒ TAP 25 `sched: multi-hart`
# ĐỎ, không marker. Đây là đột biến **trực tiếp** của tiêu chí "cả **bốn** hart vào pha": nếu
# runner vẫn XANH khi chỉ hai hart chọn thì "bốn hart" chỉ là chữ in. Chỉ dùng cho đột biến.
two-hart-sched = []
# **KT-310** — đột biến (ii): khoá pha nhiều hart thành **no-op** + kéo dài cửa sổ đọc `head`
# **30 ms** (PIT kênh 2) ⇒ hai hart cùng lấy **một** tác vụ ⇒ `# sched: BAD double-pick` + halt
# (ĐỎ, không marker). Chứng minh khoá + ownership là **bắt buộc**, không phải trang trí. Chỉ dùng
# cho đột biến.
no-sched-lock = []
# **KT-316** — đột biến (i) của khoá COM1: **bỏ hẳn** khoá (mọi đường in gọi thẳng byte). Khoá
# không bao giờ được lấy ⇒ `acquired = 0` ⇒ `# com: lock ok=0` + TAP 28 ĐỎ (không marker). Đây là
# đột biến **tất định**; log xen ký tự (triệu chứng gốc) có thể không tái hiện mỗi boot — xem
# journal KT-316 §5. Chỉ dùng cho đột biến.
no-com-lock = []
# **KT-316** — đột biến (ii): giữ CAS nhưng **không** `cli`/`sti` quanh vùng găng (chuyển tiếp
# feature cùng tên của `vifast-plat-x86_64`). Mô phỏng "khoá mà không tắt ngắt" ⇒ hazard tự
# deadlock khi ngắt in trên chính hart đang giữ khoá. Chỉ dùng cho đột biến.
no-com-cli = ["vifast-plat-x86_64/no-com-cli"]
# **KT-318** — đột biến (i) của priority: chọn **FIFO** (`psched::prio_pick_fifo`) thay vì tác vụ
# ưu tiên cao nhất ⇒ lượt chọn đầu là `a` thay vì `b` ⇒ TAP 29 `sched: priority` ĐỎ (không
# marker). Chứng minh phép kiểm priority **có răng**, không phải "in bảng rồi tự khen". Chỉ dùng
# cho đột biến.
no-prio = []
# **KT-318** — đột biến (ii) của sleep/wake: `sleep(0)` (tác vụ `u`) trở thành "**không bao giờ**
# thức" (`WakeAt = u64::MAX`) ⇒ pha chỉ kết thúc được nhờ **trần cứng** `PRIO_HARD_TICKS` (48
# tick) ⇒ log in `hard=1 wakes=3` và TAP 29/30 ĐỎ. Đây là ca chứng minh trần cứng: boot **không**
# treo, đỏ **có chẩn đoán**. Chỉ dùng cho đột biến.
no-wake = []
# **KT-337** — bật pha **virtio-gpu 2D** (TAP 35) cho runner `gpu-x86_64.sh`: PCI (BAR firmware
# đã gán) → sáu lệnh 2D → framebuffer 640×480 → `screendump` PPM. Ảnh **không** bật feature này
# giữ nguyên 34 TAP của `run-x86_64.sh`.
gpu = []

# **KT-336a** — ba đột biến của khoá MCS bọc IRQ (chuyển tiếp feature của `vifast-plat-x86_64`):
# (i) `mut-no-irq` bỏ `cli` ⇒ ngắt mềm chạy trong vùng găng; (ii) `mut-leak-unlock` bỏ nhánh nhả
# khoá ⇒ lần lấy kế tiếp chạm trần; (iii) `mut-no-lock` bỏ phần MCS ⇒ hai ngữ cảnh cùng vào vùng
# găng. Cả ba làm TAP 34 ĐỎ — chỉ dùng cho đột biến.

[dependencies]
# Toàn bộ asm/MMIO nằm trong `global_asm!` của ảnh này (không cần `unsafe`); dữ liệu (offset
# thanh ghi, entry bảng trang, GDT, header) lấy từ crate arch để test host chốt đúng giá trị.
vifast-plat-x86_64 = { path = "../vifast-plat-x86_64" }
# **KT-340c** — core kernel dùng chung 3 arch (D2-233): ảnh kiểm dựng `Machine`, gọi
# `syscall::dispatch` từ `int 0x80`, và kiểm `Tcb.*`/IPC. `optional` + bật trong `ktest` để ảnh
# sản phẩm **không** kéo model 184.792 B `.bss` vào (trần 65.536 B — xem `budget-x86_64.sh`).
vifast-core = { path = "../vifast-core", optional = true }
# **KT-341** — parser ELF64 dùng chung (D2-26) cho chương trình U-mode nạp thật.
vifast-elf = { path = "../../lib/vifast-elf", optional = true }
# **KT-270** (D2-207): số hiệu syscall của U-mode lấy từ **hằng sinh** `vifast-gen`
# (`SYS_DEBUG_PUT_STR`, `SYS_EXIT`) — không chép tay 12/14 (D2-11). Crate `no_std`, không
# dependency ngoài; `global_asm!` nhận `const` operand nên stub ring 3 đổi theo spec.
vifast-abi = { path = "../../lib/vifast-abi" }
# **KT-274** (D2-208): bước PCI/net dùng thẳng **kiểu** của hai crate thuần đã có host test —
# `vifast_virtio::pci::VirtioKind` (loại thiết bị cần tìm) + `vifast_virtio::features::DRIVER_OK`
# (bit `device_status` phải đọc lại) + `vifast_net::addr::Ipv4Addr` (địa chỉ slirp). Không chép
# lại hằng/kiểu nào của hai crate này vào ảnh.

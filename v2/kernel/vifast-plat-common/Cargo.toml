[package]
name = "vifast-plat-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform dùng chung no_std cho kernel K3: trait Platform + PanicHandler (không unsafe)"

[dependencies]
# KT-46: dùng lại hằng số/hình Sv39 của K2 (`VA_BITS=39`, 3 cấp, `walk_shape`, `Pte`) — crate
# nội bộ, `no_std`, không dependency ngoài (D2-21). Không phải crate mới, không đổi `spec/`.
vifast-pte = { path = "../../lib/vifast-pte" }
# KT-62: façade syscall gọi thẳng bảng dispatch của core (`vifast_core::syscall`); core **không**
# phụ thuộc ngược lại plat-common (một chiều, D2-83).
vifast-core = { path = "../vifast-core" }
# KT-67 (D2-95): allocator Frame **duy nhất** trên Untyped — object layer bỏ `pa_used`/
# `pa_holes` riêng, dùng `vifast_alloc::FrameArena` (một nguồn sự thật byte, no_std, safe).
vifast-alloc = { path = "../../lib/vifast-alloc" }

[dev-dependencies]
# KT-164: test generic `kiem_tung_dinh_dang<F: PageTableFormat>` chạy **cùng một thân** cho Sv39
# (crate này) và AArch64 (crate kia) — cần định dạng AArch64 để chứng minh trait dùng chung thật.
# Chỉ dev-dependency: ảnh sản phẩm và L0 build thường **không** kéo crate aarch64.
vifast-plat-aarch64 = { path = "../vifast-plat-aarch64" }

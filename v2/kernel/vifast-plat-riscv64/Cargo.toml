[package]
name = "vifast-plat-riscv64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform QEMU virt riscv64 K3: entry, UART, SBI + cài Platform (có unsafe, D2-17)"

[features]
default = []
# Chỉ ảnh test (`vifast-kbin-ktest*`, feature `ktest`) bật: probe guard load resume-một-lần.
# Ảnh sản phẩm **không** có probe/chuỗi test; chính sách guard fault của nó luôn fatal.
ktest = []
# **KT-77b** — phần **kernel** mà đường U-mode cần, tách khỏi harness: chép/chuyển root VSpace
# (`obj::copy_kernel_low_root`/`switch_root`/`restore_kernel_root`) và `sstatus.SUM`
# (`obj::set_sum`). Trước KT-77b bốn hàm này nằm sau `feature = "ktest"` **chỉ vì** ảnh test là
# ảnh duy nhất có U-mode; ảnh sản phẩm bật U-mode sẽ kéo cả `probe`/TAP vào — đúng lỗi "user mode
# phụ thuộc test harness" (OD-K6-1). `ktest` **không** còn là điều kiện của `user`.
umode = []
# KT-53: ảnh có U-mode (nạp `init` ELF + sret): `ktest-user`/`ktest-proc`/`ktest-con`/`ktest-exec`
# (bật thêm `ktest`) và **KT-77b** ảnh sản phẩm `--features product-shell` (không `ktest`).
user = ["umode"]
# **KT-77c** — phần **kernel** của virtio-blk (PCI ECAM + driver + cửa sổ MMIO PCIe), tách khỏi
# harness: trước KT-77c `vblk` khai `ktest` nên ảnh **sản phẩm** bật virtio-blk là kéo cả `probe`/
# TAP vào — **cùng lỗi** "user mode phụ thuộc test harness" mà KT-77b đã sửa cho U-mode (OD-K6-1).
# Driver không gọi hàm test nào; `ktest` chỉ cần cho các ảnh test vì chúng dùng chung feature.
# Không đổi một dòng mã driver nào (chỉ nhãn feature) — kiểm bằng `kt77c-harness-scan.sh`.
block = []
# KT-72: PCI ECAM + virtio-blk — **chỉ ảnh `ktest-vblk`** (bật cùng `ktest`). Ảnh `ktest` chính
# giữ nguyên `.text`/mapping: TAP 35 map thử **cùng VA `0x4000_0000`** mà driver vblk map cửa sổ
# PCIe (2 MiB) — nếu map trong ảnh `ktest` thì TAP 35 đỏ (`AlreadyMapped`). Vì vậy driver nằm ở
# ảnh riêng; ảnh sản phẩm **không** có driver (KT-73 sẽ mở).
vblk = ["block", "ktest"]
# KT-73: PCI (dùng lại của KT-72) + virtio-console 2 queue — chỉ ảnh `ktest-con`. Ảnh sản phẩm
# **không** bật (chưa có người nhận U-mode — xem `docs/k6-console.md` §6, `BLOCKED` có `file:line`).
vcon = ["ktest"]
# **KT-245** (D2-196): PCI (dùng lại của KT-72) + virtio-net 2 queue + MAC thật — chỉ ảnh
# `ktest-net`. Ảnh sản phẩm **không** bật (chưa có net server U-mode; D2-196 mục (2)).
net = ["ktest"]
# **KT-255** (D2-200): PCI (dùng lại của KT-72) + virtio-input 1 queue `event` + bảng chuyển mã
# phím → ASCII — chỉ ảnh `ktest-input`. Ảnh sản phẩm **không** bật (chưa có người nhận bàn phím
# ở U-mode; D2-200 mục (2) chỉ mở D1 phần 3 ở mức driver + ảnh test).
input = ["ktest"]
# KT-74: `exec(path)` (nạp ELF mới thay ảnh hiện tại) — chỉ ảnh `ktest-exec`; module `exec` cần
# loader U-mode nên kéo theo `user`. Ảnh sản phẩm **không** bật (chưa có U-mode/shell — nợ D2-113
# ghi `BLOCKED` có số ở `docs/k6-exec.md` §7).
exec = ["user"]
# **KT-263** (D2-203): PCI (dùng lại của KT-72) + virtio-gpu 2D một queue `controlq` + framebuffer
# 640×480 ở dải PA riêng — chỉ ảnh `ktest-gpu`. Ảnh sản phẩm **không** bật (chưa có người nhận
# màn hình ở U-mode; D2-203 mục (3) chỉ mở D1 phần 4 ở mức driver + ảnh test).
gpu = ["ktest"]

[dependencies]
vifast-plat-common = { path = "../vifast-plat-common" }
# KT-53: parse/validate ELF64 user (`PT_LOAD`, W^X) — crate nội bộ `no_std`,
# `forbid(unsafe_code)`, không dependency ngoài (D2-21); loader/map vẫn ở crate arch.
vifast-elf = { path = "../../lib/vifast-elf" }
# KT-61: core `no_std` (CNode/MDB/cap/TCB/scheduler/IPC) link vào ảnh kernel thật.
# Crate nội bộ, `forbid(unsafe_code)`, không `alloc` (D2-21). D2-83: core **không** sở hữu
# Frame/PageTable/VSpace — phần đó vẫn ở `vifast-plat-common::obj` (KT-52).
vifast-core = { path = "../vifast-core" }
# KT-72: logic THUẦN của virtio-blk (split ring, PCI cap/BAR, blk config) — `no_std`,
# `forbid(unsafe_code)`, test host đầy đủ (`v2/lib/vifast-virtio/tests/logic.rs`); crate arch chỉ
# còn phần chạm thanh ghi.
vifast-virtio = { path = "../../lib/vifast-virtio" }
# KT-73: ring 1P/1C của KT-69 (header/slot/magic) dùng làm kênh byte UART → U-mode; kernel cài
# `Mem` bằng physmap (`uart_console::PhysMem`). Crate `no_std`, không unsafe.
vifast-ring = { path = "../../lib/vifast-ring" }
# **KT-246b** (D2-196): codec mạng **thuần** (Ethernet/ARP/IPv4/ICMP/UDP/DHCP) — `no_std`,
# `deny(unsafe_code)`, không dependency ngoài (D2-21), 58 test host. Driver `virtio_net` chỉ còn
# phần MMIO/queue/DMA + chính sách client; **không** còn bản sao codec nào trong kernel.
vifast-net = { path = "../../lib/vifast-net" }

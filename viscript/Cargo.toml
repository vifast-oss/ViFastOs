# Workspace dòng ViScript (ST-01). Crate lõi theo thiết kế §14.2; hiện có `vis-diag` (sổ mã lỗi,
# ST-02b), `vis-syntax` (lexer + parser/CST, ST-04/ST-05), `vis-fmt` (ST-07), `vis-types`
# (HIR + giải tên, ST-11) và `vis-cli`.
[workspace]
resolver = "2"
members = [
    "crates/vis-diag",
    "crates/vis-syntax",
    "crates/vis-cli",
    "crates/vis-fmt",
    "crates/vis-types",
    "crates/vis-interp",
    "crates/vis-bytecode",
    "crates/vis-vm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vifast-oss/ViFastOs"

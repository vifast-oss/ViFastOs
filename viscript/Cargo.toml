# Workspace dòng ViScript (ST-01). Crate lõi theo thiết kế §14.2; hiện có `vis-diag` (sổ mã lỗi,
# ST-02b), `vis-syntax` (lexer, ST-04) và `vis-cli`.
[workspace]
resolver = "2"
members = [
    "crates/vis-diag",
    "crates/vis-syntax",
    "crates/vis-cli",
    "crates/vis-fmt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vifast-oss/ViFastOs"

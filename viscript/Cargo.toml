# SPDX-License-Identifier: MIT OR Apache-2.0
# Workspace dòng ViScript (ST-01). Crate lõi theo thiết kế §14.2; hiện mới có `vis-diag`
# để workspace hợp lệ và để ST-02b mở rộng sổ mã lỗi.
[workspace]
resolver = "2"
members = [
    "crates/vis-diag",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vifast-oss/ViFastOs"

# KT-400 (D2-259) — cây mã v1 đã gỡ khỏi `main`; bản gốc bất biến ở tag `v1-archive`
# (`ca2eaf5`). Repo **không còn workspace v1** (`crates/`).
#
# Workspace duy nhất của dòng OS là **`v2/Cargo.toml`**. Mọi lệnh cargo phải dùng
# `--manifest-path v2/Cargo.toml` (hoặc chạy qua `./v2/bin/v2`); tệp này chỉ giữ một
# workspace rỗng để `cargo <lệnh>` từ gốc repo vẫn hợp lệ và **không** quay lại quét v1.
[workspace]
resolver = "2"
members = []
